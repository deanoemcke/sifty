<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sifty</title>
  <link rel="icon" type="image/png" href="/sifty-favicon.png">
  <link rel="stylesheet" href="/src/frontend/styles.css">
</head>
<body>
<div class="app-layout">
<aside class="sidebar">
  <header>
    <button id="brandLink" class="brand" type="button" aria-label="Sifty home"></button>
    <div class="brand-image" aria-hidden="true">
      <img src="sifty-logo.png" alt="" width="128" height="128">
    </div>
    <h1 id="brandHeading">Sifty</h1>
  </header>

  <nav class="sidebar-tabs" role="tablist">
    <button id="searchTabBtn" class="sidebar-tab active" role="tab" aria-selected="true" aria-controls="searchTabPanel">Search</button>
    <button id="favouritesTabBtn" class="sidebar-tab" role="tab" aria-selected="false" aria-controls="savedSearchesPanel">Favourites</button>
  </nav>

  <div id="searchTabPanel" role="tabpanel">

  <!-- Discovery prompt -->
  <div id="discoveryCard" class="card" style="margin-bottom:0">
    <div class="prompt-box">
      <textarea id="discoveryPrompt" rows="3" placeholder="What are you after?"></textarea>
    </div>
    <div class="field-row">
      <label for="discoveryMaxPrice">Max price</label>
      <input id="discoveryMaxPrice" type="number" min="0" />
    </div>
    <div class="field-row">
      <label for="discoveryRegion">Region</label>
      <select id="discoveryRegion"></select>
    </div>
    <label class="checkbox-row" for="discoveryAllowShipping">
      <input id="discoveryAllowShipping" type="checkbox" />
      Allow shipping
    </label>
    <label class="checkbox-row" for="discoveryIncludeSoldItems">
      <input id="discoveryIncludeSoldItems" type="checkbox" />
      Include sold items
    </label>
    <label class="checkbox-row" for="discoveryIncludeNewItems">
      <input id="discoveryIncludeNewItems" type="checkbox" />
      Include new items
    </label>
    <div class="discovery-actions">
      <!-- Label set by JS (DISCOVERY_BUTTON_LABEL) -->
      <button id="discoveryBtn" class="btn btn-primary" disabled></button>
    </div>
  </div>

  </div><!-- /searchTabPanel -->

  <div id="savedSearchesPanel" class="hidden" role="tabpanel">
    <div id="savedSearchesHeaderRow" class="saved-search-header-row hidden">
      <span class="saved-search-col-name">Name</span>
      <span class="saved-search-col-alert" title="Alert on new listings" aria-label="Alert on new listings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" fill="none"/></svg>
      </span>
      <span class="saved-search-col-delete" aria-hidden="true"></span>
    </div>
    <div id="savedSearchesList">
      <p class="deep-empty" id="savedSearchesEmpty">No favourites yet.</p>
    </div>
    <button id="saveCurrentBtn" class="btn btn-primary save-current-btn" type="button" disabled>Save current search</button>
  </div>

  <!-- Source URLs — revealed once a search runs -->
  <div id="urlsSection" class="hidden">
    <!-- Source URLs (rows populated by JS) -->
    <div id="urlsCard" class="card">
      <div id="discoveryError" style="display:none;margin-bottom:0.75rem;color:var(--red);font-size:0.85rem;text-align:center"></div>
      <div id="discoveryWarnings" style="display:none;margin-bottom:0.75rem;color:var(--yellow);background:var(--yellow-bg);padding:0.5rem;border-radius:6px;font-size:0.85rem;text-align:center"></div>
      <div id="urlPlaceholder" class="url-group-header hidden">
        <span class="spinner"></span><span>Discovering urls…</span>
      </div>
      <div id="urlCardsContainer"></div>
      <button id="addUrlBtn" class="btn btn-secondary" style="width:100%;justify-content:center;border-style:dashed">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add URL
      </button>
    </div>
  </div>

  <!-- Status bar -->
  <div id="statusBar" class="status-bar info hidden"></div>
</aside>

<main class="main-pane">
  <!-- Results header — sticky above the listings -->
  <div id="resultsSection" class="results-header hidden">
      <div class="results-header-row ai-filter-row" id="aiFilterPanel">
        <label for="aiFilter" class="ai-filter-label">AI filter</label>
        <textarea id="aiFilter" rows="1" placeholder="Add more detail to filter your search results"></textarea>
        <button id="aiFilterBtn" class="btn btn-primary ai-filter-btn" type="button" disabled>Filter</button>
      </div>
      <div class="results-header-row sort-row">
        <!-- Trigger/panel markup built by buildDropdownShell / buildDropdownTriggerHtml (dropdownPanel.ts) -->
        <div class="dropdown-control" id="aiFilterDropdown"></div>
        <div class="dropdown-group">
          <label for="showDropdownBtn" class="dropdown-external-label">Showing</label>
          <div class="dropdown-control" id="showDropdown"></div>
        </div>
        <div class="dropdown-group">
          <label for="sortDropdownBtn" class="dropdown-external-label">Sort by</label>
          <div class="dropdown-control" id="sortDropdown"></div>
        </div>
        <button id="deepBtn" class="cache-clear-btn hidden" type="button">
          <!-- icon populated from SEARCH_ICON in icons.ts, see initApp in app.ts -->
          <span class="dropdown-trigger-icon"></span>
          <span class="dropdown-trigger-label">deep search</span>
        </button>
      </div>
  </div>
  <div id="listingsContainer"></div>
</main>
</div>

<!-- Save favourite modal -->
<div id="saveSearchModal" class="modal-backdrop hidden">
  <div class="modal">
    <p class="modal-title">Save favourite</p>
    <input type="text" id="saveSearchName" placeholder="Name this favourite…" style="width:100%;margin-bottom:0.75rem" />
    <div id="saveSearchError" style="display:none;margin-bottom:0.75rem;color:var(--red);font-size:0.85rem;text-align:center"></div>
    <div style="display:flex;gap:0.5rem;justify-content:flex-end">
      <button id="saveSearchCancelBtn" class="btn btn-secondary">Cancel</button>
      <button id="saveSearchConfirmBtn" class="btn btn-primary">Save</button>
    </div>
  </div>
</div>

<!-- Listing detail modal -->
<div id="listingModal" class="modal-backdrop hidden">
  <div class="modal modal-listing">
    <button id="listingModalCloseBtn" class="btn icon-btn modal-close-btn" type="button" title="Close" aria-label="Close">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 5L19 19M5 19L19 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="listing-modal-scroll">
      <div id="listingModalBody" class="listing-modal-body"></div>
    </div>
  </div>
</div>

<script type="module" src="/src/frontend/app.ts"></script>
</body>
</html>
